networks:
  cubeai-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_models:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: cubeai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cubeai_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cubeai_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cubeai_hrms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cubeai_admin} -d ${POSTGRES_DB:-cubeai_hrms}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cubeai-network

  redis:
    image: redis:7-alpine
    container_name: cubeai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cubeai-network

  ollama:
    image: ollama/ollama:latest
    container_name: cubeai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - cubeai-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cubeai-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      HOST: 0.0.0.0
      OLLAMA_BASE_URL: http://ollama:11434
      AI_MOCK_FALLBACK: "true"
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-cubeai_internal_secret_key_2026}
      PYTHONUNBUFFERED: "1"
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cubeai-network

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: cubeai-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-cubeai_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cubeai_secret_pass}
      DB_NAME: ${POSTGRES_DB:-cubeai_hrms}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-cubeai_internal_secret_key_2026}
      JWT_SECRET: ${JWT_SECRET:-super_secure_jwt_secret_hrms_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - cubeai-network

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: cubeai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - cubeai-network
